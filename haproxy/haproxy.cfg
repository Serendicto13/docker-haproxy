global
    daemon
    maxconn 256
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  1h

frontend http-in
    bind *:80
    acl is_api path_beg /api/
    acl is_stats path_beg /stats
    use_backend backend if is_api
    use_backend stats_backend if is_stats
    default_backend frontend

backend frontend
    server frontend frontend:3000

backend backend
    balance roundrobin
    option httpchk GET /api/hello
    server backend1 backend1:8000 check 
    server backend2 backend2:8000 check

backend stats_backend
    stats enable
    stats uri /stats
    stats refresh 5s
