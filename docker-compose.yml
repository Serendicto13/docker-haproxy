services:
  frontend:
    build: ./frontend
    expose:
      - "3000"
    networks:
      - app-net

  backend1:
    build: ./backend
    hostname: backend1
    expose:
      - "8000"
    networks:
      - app-net

  backend2:
    build: ./backend
    hostname: backend2
    expose:
      - "8000"
    networks:
      - app-net

  haproxy:
    image: haproxy:2.8
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend1
      - backend2
    networks:
      - app-net

networks:
  app-net:
    driver: bridge